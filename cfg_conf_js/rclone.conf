# ============================================================
# rclone.conf template - backup ke Google Drive
# GANTI dengan remote milik AKUN GOOGLE ANDA SENDIRI.
#
# Cara membuat remote 'mybackup' dengan akun sendiri:
#   1) Jalankan:  rclone config
#   2) Pilih:  n (new remote) -> nama: mybackup -> type: drive
#   3) Ikuti login Google (scope drive), lalu save.
#
# JANGAN membagikan file ini ke publik - berisi token akses
# ke akun Google Anda.
# ============================================================
# [mybackup]
# type = drive
# scope = drive
# token = {"access_token":"...","refresh_token":"..."}
